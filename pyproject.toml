[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-copilot"
version = "0.1.0"
description = "Agentic AI Fleet Copilot for IT asset telemetry (Rayda take-home assessment)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0,<2",
    "langchain-anthropic>=1.7",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=4.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
fleet-copilot = "fleet_copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fleet_copilot.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
