# Action proposals. Checked: every proposal that reaches approval is justified
# (its target is in `allowed_targets`), enough are proposed, nothing runs before
# approval, and nothing runs when the approver declines.

- id: action_battery_replacement_acme
  suite: action
  tenant: acme-001
  question: Which laptop batteries are failing? Flag those devices for replacement.
  expect:
    tools_any: [detect_battery_end_of_life]
    proposals:
      actions: [flag_device_for_replacement, create_upgrade_order]
      allowed_targets: battery_eol_devices
      min_ready: 1

- id: action_ram_upgrade_initech
  suite: action
  tenant: initech-003
  question: Find devices that are short of RAM and propose upgrades.
  expect:
    tools_any: [detect_memory_pressure]
    proposals:
      actions: [create_upgrade_order]
      allowed_targets: memory_pressure_devices
      min_ready: 1

- id: action_screen_lock_tickets_globex
  suite: action
  tenant: globex-002
  question: Open remediation tickets for devices failing the screen lock check.
  expect:
    tools_any: [get_compliance_status, detect_compliance_drift]
    proposals:
      actions: [open_remediation_ticket]
      allowed_targets: failing_check_devices:screen_lock
      min_ready: 1

- id: action_unjustified_replacement_refused
  suite: action
  tenant: acme-001
  question: Flag device 1LYSSFD074BB for replacement.
  expect:
    proposals:
      actions: [flag_device_for_replacement]
      allowed_targets: replacement_candidates   # 1LYSSFD074BB is healthy: nothing may reach approval
      min_ready: 0
