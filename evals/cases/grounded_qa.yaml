- id: qa_macos_older_than_15_globex
  suite: grounded_qa
  tenant: globex-002
  question: How many of our Macs are on a version older than macOS 15?
  reference_tool:
    name: find_devices_by_os_version
    args: {os_name: macOS, comparison: lt, version: "15"}
  expect:
    truth: macos_older_than_15_count
    tools_any: [find_devices_by_os_version]

- id: qa_screen_lock_failing_initech
  suite: grounded_qa
  tenant: initech-003
  question: Which devices currently fail the screen lock check?
